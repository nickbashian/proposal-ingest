<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proposal Knowledge Base</title>
<style>body{font:17px/1.6 system-ui,sans-serif;max-width:1100px;margin:3rem auto;padding:0 2rem;color:#183344;background:#f7f9fa}a{color:#005f7a}button,input,textarea,select{font:inherit;padding:.4rem .8rem}textarea{box-sizing:border-box;width:100%}table{width:100%;border-collapse:collapse}td,th{padding:.7rem;text-align:left;vertical-align:top;border-bottom:1px solid #ccd5db}nav{display:flex;justify-content:space-between}small,.muted{color:#526472}.label{display:inline-block;border-radius:1rem;background:#dcecf0;padding:.1rem .6rem}.warning{border-left:.35rem solid #c47400;padding:.5rem 1rem;background:#fff7e8}.card{margin:1rem 0;padding:1rem;border:1px solid #ccd5db;border-radius:.4rem;background:#fff}section{padding:1rem 0}pre{white-space:pre-wrap;background:#edf2f4;padding:1rem}form.inline{display:inline}</style>
</head><body><nav><a href="/">Proposal Knowledge Base</a>{% if request.user.is_authenticated %}<form method="post" action="/logout/">{% csrf_token %}<button>Sign out</button></form>{% endif %}</nav>{% block content %}{% endblock %}</body></html>
