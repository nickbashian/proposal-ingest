app:
  schema_version: "0.1.0"
  output_root: null
  source_root: null
  log_level: "INFO"

aws:
  profile: "proposal-assistant"
  region: "us-east-1"

bedrock:
  model_label: "opus-4.6"
  model_id: "us.anthropic.claude-opus-4-6-v1"
  max_direct_upload_mb: 20
  save_raw_model_responses: true
  mock_bedrock: false
  temperature: 0
  max_tokens: 4096
  retry_invalid_json_once: true

scanner:
  year_folder_regex: "^20[0-9]{2}$"
  ignore_stray_files_in_year_folders: true
  skip_hidden_files: true
  skip_system_files: true
  skip_temp_office_files: true
  hash_algorithm: "sha256"

tracker:
  enabled: true
  path: null
  sheet_name: null
  header_row: 0

processing:
  direct_upload_default: true
  excel_local_extract_first: true
  local_extract_max_chars: 200000
  tiny_excel_max_sheets: 3
  tiny_excel_max_nonempty_cells: 500
  tiny_excel_max_size_mb: 1
  ocr_enabled: false
  pass2_enabled: true
  pass2_confidence_threshold: 0.65
  stop_before_clean_set_if_critical_questions: true

questions:
  suppress_low_priority: true
  target_questions_per_file: 3

review:
  max_questions_per_proposal: 3
  max_questions_per_run: 20
  include_low_priority: false

clean_set:
  sanitize_filenames: true
  flatten_documents_folder: true
  copy_excluded_files: false
  require_manual_review_clearance: true

s3_manifest:
  enabled: true
  base_prefix: "proposal-history"

synthesis:
  policies_path: null
  max_full_text_documents: 8
  max_full_text_chars_per_doc: 6000

# Persistent application defaults. Live providers are intentionally unavailable in MVP-01.
web_application:
  fixture_source_root: "sample_data/fake_source_root/2025"
  fixture_slice_path: "sample_data/application_slice/family.json"
  fixture_slice_revision: "mvp02-fixture-v1"
  classification_demo_source_root: "sample_data/application_slice/2025/Fictional 05b"
  local_storage_root: "tmp/app_storage"
  publication_backend: "local"
  publication_hold: false
  publication_s3_prefix: "curated/"
  publication_max_metadata_bytes: 10240
  publication_max_artifact_bytes: 1048576
  publication_retrieve_limit: 20
  publication_reconcile_timeout_seconds: 600
  development_database_url: "postgresql://proposal_ingest:local-development-only@127.0.0.1:54329/proposal_ingest_dev"
  session_seconds: 3600
  request_max_bytes: 1048576
  lease_seconds: 120
  max_attempts: 3
  backoff_seconds: 5
  poll_seconds: 2
  setup_limit_usd: "500"
  monthly_limit_usd: "50"
  job_limit_usd: "5"
  fixture_reservation_usd: "0.01"
  max_snapshot_bytes: 52428800
  extraction_revision: "structured-v1"
  extraction_schema_revision: "units-v1"
  extraction_max_source_bytes: 26214400
  extraction_max_archive_entries: 1500
  extraction_max_uncompressed_bytes: 104857600
  extraction_max_pages: 200
  extraction_max_units: 10000
  extraction_max_chars: 1000000
  extraction_max_spreadsheet_cells: 10000
  extraction_max_visual_tasks_per_version: 5
  extraction_max_visual_text_chars: 2000
  extraction_ocr_executable: null
  extraction_ocr_timeout_seconds: 20
  extraction_ocr_dpi: 150
  extraction_max_render_pixels: 5000000
  extraction_parser_timeout_seconds: 30
  curation_review_target: 10
  curation_minutes_per_exception: 3
  curation_max_evidence_units: 100
  curation_max_summary_chars: 4000
  curation_max_reconcile_versions: 8
  curation_max_reconcile_facts: 40
  curation_policy_revision: "curation-v1"
  classification_auto_policy_revision: "mock-only-05b-v1"
  classification_model_revision: "baseline-opus-4.6-v1"
  classification_prompt_revision: "ingest-source-v1"
  classification_schema_revision: "ingest-suggestions-v1"
  classification_max_jobs_per_run: 2000
  classification_max_output_tokens: 1200
  classification_numeric_entity_terms:
    - capacity
    - voltage
    - conductivity
    - energy density
  curation_prohibited_sensitivity:
    - financial_sensitive
    - personal_sensitive
  classification_routes:
    baseline:
      provider: bedrock
      model_id: "us.anthropic.claude-opus-4-6-v1"
    economical:
      provider: bedrock
      model_id: null
    jev:
      provider: jev
      model_id: "jev-latest"
      enabled: false
  classification_task_routes:
    source_role: baseline
    content_use: baseline
    claim_type: baseline
    treatment: baseline
  jev_api_url: "https://api.typesafe.ai/v1/systemone"
  classification_max_excerpt_chars: 4000
  classification_max_cases_per_run: 100
  classification_estimate_usd_per_call:
    baseline: null
    economical: null
    jev: null
