name: proposal-ingest-dev

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: proposal_ingest_dev
      POSTGRES_USER: proposal_ingest
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proposal_ingest -d proposal_ingest_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - proposal_ingest_postgres:/var/lib/postgresql

volumes:
  proposal_ingest_postgres:
