[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proposal-ingest"
version = "0.1.0"
description = "Local-first proposal archive ingestion and metadata pipeline"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "psycopg[binary]>=3.2,<4",
  "Authlib>=1.6,<2",
  "requests",
  "boto3",
  "botocore",
  "pydantic>=2",
  "python-dotenv",
  "pyyaml",
  "pandas",
  "openpyxl",
  "pypdf",
  "python-docx",
  "typer",
  "rich",
]

[project.optional-dependencies]
dev = [
  "pytest-django",
  "black",
  "ruff",
  "codespell",
  "pre-commit",
  "pytest",
  "playwright>=1.63,<1.64",
  "pytest-playwright>=0.9,<0.10",
  "mypy",
  "types-PyYAML",
  "pandas-stubs",
]

[project.scripts]
proposal-ingest = "proposal_ingest.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "proposal_app.settings"

[tool.setuptools.package-data]
proposal_app = ["templates/**/*.html"]
