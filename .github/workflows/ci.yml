name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: proposal_ingest_dev
          POSTGRES_USER: proposal_ingest
          POSTGRES_PASSWORD: local-development-only
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U proposal_ingest -d proposal_ingest_dev"
          --health-interval 2s --health-timeout 3s --health-retries 20
    permissions:
      contents: read
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      MOCK_BEDROCK: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: python scripts/dev.py bootstrap
      - name: Install Chromium and Linux dependencies
        run: .venv/bin/python scripts/dev.py install-browser
      - name: Canonical checks
        run: make check
      - name: Existing mock pipeline
        run: make mock-run
